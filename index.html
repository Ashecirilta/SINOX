<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <title>SINOX · Elígete a ti</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>SINOX</h1>
        <p>Elígete a ti.</p>
      </div>
      <div class="counter" id="counter">0 / 100</div>
    </header>

    <section id="loading" class="loading">
      <div class="spinner"></div>
      <strong>Preparando tus 100 de hoy…</strong>
      <span>La primera carga del día puede tardar un poco. Después queda guardada.</span>
    </section>

    <section id="game" class="game hidden" aria-live="polite">
      <article id="card" class="card">
        <div class="badge no-badge">NO</div>
        <div class="badge yes-badge">SÍ</div>
        <img id="art" alt="" draggable="false">
        <div class="meta">
          <span id="category" class="category"></span>
          <h2 id="title"></h2>
          <p id="author"></p>
        </div>
      </article>

      <div class="actions">
        <button id="noBtn" class="no" aria-label="No">NO</button>
        <button id="yesBtn" class="yes" aria-label="Sí">SÍ</button>
      </div>
      <p class="hint">Desliza ← NO · SÍ →</p>
    </section>

    <section id="results" class="results hidden">
      <h2>Tus SÍ</h2>
      <p id="resultCount"></p>
      <div id="grid" class="grid"></div>
      <button id="restartBtn" class="restart">Volver a ver los 100</button>
    </section>

    <section id="error" class="error hidden">
      <h2>No he podido cargar las obras</h2>
      <p>Comprueba la conexión y vuelve a intentarlo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
